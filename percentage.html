<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#635bff">
<title>Percentage Calculator - CalcX</title>
<meta name="description" content="Calculate your marks, percentage and grade for free with CalcX.">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7ff;
  color: #172033;
  padding: 20px;
}

header {
  max-width: 500px;
  margin: 15px auto 30px;
}

header a {
  color: #635bff;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
}

h1 {
  text-align: center;
  color: #635bff;
  font-size: 30px;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #667085;
  font-size: 15px;
  margin-bottom: 25px;
}

.calculator {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 8px 30px #00000010;
}

label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin: 18px 0 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #635bff;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 22px;
  border: none;
  border-radius: 10px;
  background: #635bff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

.result {
  display: none;
  margin-top: 22px;
  padding: 20px;
  background: #f0efff;
  border-radius: 14px;
  text-align: center;
}

.result h2 {
  font-size: 16px;
  color: #667085;
}

.percentage {
  font-size: 38px;
  font-weight: bold;
  color: #635bff;
  margin: 12px 0;
}

.result p {
  font-size: 15px;
  margin-top: 10px;
}

.error {
  color: #d93030;
  font-size: 14px;
  margin-top: 12px;
}

footer {
  text-align: center;
  margin: 30px 0;
  color: #667085;
  font-size: 14px;
}

</style>
</head>

<body>

<header>
  <a href="index.html">← Back to CalcX</a>
</header>

<h1>Percentage Calculator</h1>
<p class="subtitle">Calculate your marks and grades easily.</p>

<div class="calculator">

  <label for="obtained">Obtained Marks</label>
  <input type="number" id="obtained"
    placeholder="Enter obtained marks" min="0">

  <label for="total">Total Marks</label>
  <input type="number" id="total"
    placeholder="Enter total marks" min="1">

  <button type="button" id="calculateBtn">
  Calculate Percentage
  </button>

  <p class="error" id="error"></p>

  <div class="result" id="result">
    <h2>Your Percentage</h2>
    <div class="percentage" id="percentage">0%</div>
    <p id="grade"></p>
    <p id="status"></p>
    <p id="marks"></p>
  </div>

</div>

<footer>
  © 2026 CalcX. All Rights Reserved.
</footer>

<script>
  document.getElementById("calculateBtn").addEventListener("click", calculatePercentage);

function calculatePercentage() {
function calculatePercentage() {

  const obtained = Number(
    document.getElementById("obtained").value
  );

  const total = Number(
    document.getElementById("total").value
  );

  const error = document.getElementById("error");
  const result = document.getElementById("result");

  error.textContent = "";
  result.style.display = "none";

  if (
    document.getElementById("obtained").value === "" ||
    document.getElementById("total").value === "" ||
    !Number.isFinite(obtained) ||
    !Number.isFinite(total) ||
    obtained < 0 ||
    total <= 0 ||
    obtained > total
  ) {
    error.textContent =
      "Please enter valid marks. Obtained marks cannot exceed total marks.";
    return;
  }

  const percentage = (obtained / total) * 100;

  let grade;

  if (percentage >= 90) grade = "A+";
  else if (percentage >= 80) grade = "A";
  else if (percentage >= 70) grade = "B";
  else if (percentage >= 60) grade = "C";
  else if (percentage >= 50) grade = "D";
  else if (percentage >= 35) grade = "E";
  else grade = "F";

  const status = percentage >= 35 ? "Pass" : "Below 35% threshold";

  document.getElementById("percentage").textContent =
    percentage.toFixed(2) + "%";

  document.getElementById("grade").textContent =
    "Grade: " + grade;

  document.getElementById("status").textContent =
    "Status: " + status;

  document.getElementById("marks").textContent =
    "Marks: " + obtained + " / " + total;

  result.style.display = "block";
}
</script>

</body>
</html>
