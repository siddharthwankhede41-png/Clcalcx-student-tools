
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#635bff">
<title>CGPA Calculator - CalcX</title>
<meta name="description" content="Calculate your CGPA easily with CalcX.">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7ff;
  color: #172033;
  padding: 20px;
}

header {
  max-width: 500px;
  margin: 15px auto 30px;
}

header a {
  color: #635bff;
  text-decoration: none;
  font-weight: bold;
}

h1 {
  text-align: center;
  color: #635bff;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #667085;
  margin-bottom: 25px;
}

.calculator {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 8px 30px #00000010;
}

label {
  display: block;
  font-weight: bold;
  margin: 18px 0 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 22px;
  border: none;
  border-radius: 10px;
  background: #635bff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.result {
  display: none;
  margin-top: 22px;
  padding: 20px;
  background: #f0efff;
  border-radius: 14px;
  text-align: center;
}

.result h2 {
  color: #667085;
  font-size: 16px;
}

.cgpa {
  font-size: 38px;
  font-weight: bold;
  color: #635bff;
  margin: 12px 0;
}

.error {
  color: #d93030;
  margin-top: 12px;
}

footer {
  text-align: center;
  margin: 30px 0;
  color: #667085;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <a href="index.html">← Back to CalcX</a>
</header>

<h1>CGPA Calculator</h1>
<p class="subtitle">Calculate your academic CGPA easily.</p>

<div class="calculator">

  <label for="marks">Total Grade Points</label>
  <input type="number" id="marks"
    placeholder="Enter total grade points" min="0">

  <label for="subjects">Total Subjects</label>
  <input type="number" id="subjects"
    placeholder="Enter total subjects" min="1">

  <button type="button" id="calculateBtn">
    Calculate CGPA
  </button>

  <p class="error" id="error"></p>

  <div class="result" id="result">
    <h2>Your CGPA</h2>
    <div class="cgpa" id="cgpa">0.00</div>
    <p id="grade"></p>
  </div>

</div>

<footer>
  © 2026 CalcX. All Rights Reserved.
</footer>

<script>
document.getElementById("calculateBtn")
.addEventListener("click", calculateCGPA);

function calculateCGPA() {
  const marks = Number(document.getElementById("marks").value);
  const subjects = Number(document.getElementById("subjects").value);

  const error = document.getElementById("error");
  const result = document.getElementById("result");

  error.textContent = "";
  result.style.display = "none";

  if (
    document.getElementById("marks").value === "" ||
    document.getElementById("subjects").value === "" ||
    !Number.isFinite(marks) ||
    !Number.isFinite(subjects) ||
    marks < 0 ||
    subjects <= 0 ||
    marks > subjects * 10
  ) {
    error.textContent = "Please enter valid grade points and subjects.";
    return;
  }

  const cgpa = marks / subjects;

  document.getElementById("cgpa").textContent = cgpa.toFixed(2);

  document.getElementById("grade").textContent =
    cgpa >= 9 ? "Excellent Performance!" :
    cgpa >= 8 ? "Very Good Performance!" :
    cgpa >= 7 ? "Good Performance!" :
    cgpa >= 5 ? "Average Performance!" :
    "Keep Improving!";

  result.style.display = "block";
}
</script>

</body>
</html>
